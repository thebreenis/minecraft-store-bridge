name: Offline research verification
on: [push, pull_request]
permissions:
  contents: read
jobs:
  offline:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.13'
      - run: python -m pip install requests==2.34.2 cryptography==50.0.2
      - run: python tools/verify_reference.py
      - run: python tools/run_checks.py
      - run: python tools/check_docs.py
      - run: python tools/audit_publication.py
